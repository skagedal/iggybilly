name: CI

on:
  push:
    branches: ["main"]
  pull_request: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release
      - name: Test
        run: cargo test --locked

  deploy:
    name: Build, push and deploy
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make ci scripts executable
        run: chmod +x ci/*
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: main.Dockerfile
          push: true
          # Push both an immutable SHA tag (used for the rollout) and
          # :latest (for humans pulling locally). The rollout uses the
          # SHA so a cached :latest on a node can't roll the wrong image.
          tags: |
            skagedal/iggybilly:latest
            skagedal/iggybilly:${{ github.sha }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: ./ci/setup-kubeconfig
      - name: Roll out the new image
        run: |
          kubectl -n iggybilly set image deploy/iggybilly \
            iggybilly=skagedal/iggybilly:${{ github.sha }}
          kubectl -n iggybilly rollout status deploy/iggybilly --timeout=180s
