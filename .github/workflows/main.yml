name: CI

on:
  push:
    branches: ["main"]
  pull_request: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Pinned by major rather than read from the manifest: the action
      # parses package.json, and ours is package.json5.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: web
      # tsc --noEmit plus eslint.
      - name: Check frontend
        run: pnpm run check
        working-directory: web
      # Also produces static/dist, so the Rust build and tests run
      # against a real asset manifest rather than the fallback paths.
      - name: Build frontend
        run: pnpm run build
        working-directory: web
      - name: Check formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked --release
      - name: Test
        run: cargo test --locked

  mobile:
    name: Check the mobile app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The SDK version is pinned per app in mobile/.fvmrc, which is
          # also what fvm reads locally — so a bump is one committed file
          # and CI follows it with no change here.
          flutter-version-file: mobile/.fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile
      - name: Analyze
        run: flutter analyze
        working-directory: mobile
      - name: Test
        run: flutter test
        working-directory: mobile

  deploy:
    name: Build, push and deploy
    needs: [test, mobile]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make ci scripts executable
        run: chmod +x ci/*
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: main.Dockerfile
          push: true
          # Push both an immutable SHA tag (used for the rollout) and
          # :latest (for humans pulling locally). The rollout uses the
          # SHA so a cached :latest on a node can't roll the wrong image.
          tags: |
            skagedal/iggybilly:latest
            skagedal/iggybilly:${{ github.sha }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Configure kubeconfig
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: ./ci/setup-kubeconfig
      - name: Roll out the new image
        run: |
          kubectl -n iggybilly set image deploy/iggybilly \
            iggybilly=skagedal/iggybilly:${{ github.sha }}
          kubectl -n iggybilly rollout status deploy/iggybilly --timeout=180s
