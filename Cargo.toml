[package]
name = "iggybilly"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Templates
askama = "0.13"

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "time"] }

# Auth / crypto
argon2 = "0.5"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# HTTP client for posting Discord webhook notifications. default-features
# off + rustls keeps us off OpenSSL; "json" gives us the typed body
# helper. reqwest is already a dev-dependency (the test client), so this
# adds no new transitive tree — only promotes it into the release build.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Time
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Misc
uuid = { version = "1", features = ["v4"] }

# Markdown rendering for label wiki pages. default-features=false drops
# the CLI, syntect syntax highlighting, and bon builder we don't need.
# Rendered with unsafe_=false so raw HTML in user content is escaped.
comrak = { version = "0.52", default-features = false }

# Pure-Rust audio (no ffmpeg). One library for all audio-file work:
# decoding to compute waveform peaks, and reading metadata tags (e.g. the
# recording date). default features cover flac/ogg/vorbis/wav/pcm; we add
# the codecs/formats for our other accepted types (mp3, and m4a/mp4 =
# isomp4 + aac/alac). Newer Voice Memos omit the date tag entirely, so
# the recording time is parsed by hand from the MP4 udta/date box and
# mvhd header (see handlers/clips.rs).
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4", "alac"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
# Real HTTP client with a cookie store so tests can drive the running
# router across multiple requests with session state, just like a
# browser would. rustls-tls keeps the binary off OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["cookies", "multipart", "rustls-tls"] }
tempfile = "3"
