<ul class="suggestions">
  {% for m in matches %}
    <li><button type="button" data-label-suggestion="{{ m }}">{{ m }}</button></li>
  {% endfor %}
  {% if can_create %}
    <li class="create"><button type="button" data-label-suggestion="{{ query }}">Create new label “{{ query }}”</button></li>
  {% endif %}
  {% if matches.is_empty() && !can_create %}
    <li class="empty">No matching labels.</li>
  {% endif %}
</ul>
