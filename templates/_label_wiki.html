<div class="label-wiki" id="wiki-{{ label_id }}">
  <div class="wiki-head">
    <h3 class="wiki-title">{{ label_name }}</h3>
    <span class="wiki-actions">
      <button type="button" class="link"
              hx-get="/labels/{{ label_id }}/wiki/edit"
              hx-target="#wiki-{{ label_id }}"
              hx-swap="outerHTML">Edit wiki</button>
      <a href="/labels/{{ label_id }}/wiki/history">History</a>
    </span>
  </div>
  {% if has_content %}
    <div class="wiki-content">{{ content_html|safe }}</div>
    {% if let Some(le) = last_edited %}<p class="wiki-meta">{{ le }}</p>{% endif %}
  {% else %}
    <p class="wiki-empty">
      No wiki page yet.
      <button type="button" class="link"
              hx-get="/labels/{{ label_id }}/wiki/edit"
              hx-target="#wiki-{{ label_id }}"
              hx-swap="outerHTML">Write one</button>
    </p>
  {% endif %}
</div>
