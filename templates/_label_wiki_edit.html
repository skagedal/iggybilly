<div class="label-wiki" id="wiki-{{ label_id }}">
  <div class="wiki-head">
    <h3 class="wiki-title">{{ label_name }}</h3>
  </div>
  <form class="wiki-edit"
        hx-post="/labels/{{ label_id }}/wiki"
        hx-target="#wiki-{{ label_id }}"
        hx-swap="outerHTML">
    <textarea name="content" rows="12" autofocus
              placeholder="Write this label's wiki page in Markdown… Link to another label with [[label-name]].">{{ content }}</textarea>
    <p class="hint">Markdown supported. Link to another label with <code>[[label-name]]</code> (or <code>[[label-name|text]]</code>).</p>
    <div class="wiki-edit-actions">
      <button type="submit">Save</button>
      <button type="button" class="link"
              hx-get="/labels/{{ label_id }}/wiki"
              hx-target="#wiki-{{ label_id }}"
              hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</div>
