{% extends "base.html" %}
{% block title %}Account — iggybilly{% endblock %}
{% block nav %}
  <span class="username">{{ username }}</span>
  <a href="/">Clips</a>
  <form method="post" action="/logout" class="inline"><button type="submit" class="link">Sign out</button></form>
{% endblock %}
{% block content %}
<section class="centered">
  <h1>Change password</h1>
  {% if let Some(msg) = error %}
    <p class="error">{{ msg }}</p>
  {% endif %}
  {% if let Some(msg) = success %}
    <p class="success">{{ msg }}</p>
  {% endif %}
  <form method="post" action="/account">
    <label>Current password
      <input type="password" name="current_password" autocomplete="current-password" required>
    </label>
    <label>New password
      <input type="password" name="new_password" autocomplete="new-password" required minlength="10">
    </label>
    <label>Confirm new password
      <input type="password" name="new_password_confirm" autocomplete="new-password" required minlength="10">
    </label>
    <button type="submit">Update password</button>
  </form>
</section>
{% endblock %}
