# Manifest for iggybilly-web — the React/TypeScript frontend that the
# Rust binary serves out of ../static.
#
# YAML rather than JSON, so the file can carry comments like this one. It
# used to be package.json5, which pnpm read natively — pnpm 12 dropped
# JSON5 and now looks for package.json or package.yaml only, and a manifest
# it cannot see is a lock file it happily rewrites as empty. No package.json
# is committed or generated. Nothing here is executed by Node's own
# resolver: build.mjs is ESM by its extension, and the sources under src/
# are bundled by esbuild rather than imported at runtime.
#
# Every dependency is "latest". pnpm-lock.yaml is what pins the versions
# actually installed, and minimumReleaseAge in pnpm-workspace.yaml is
# what keeps a fresh publish from being one of them; a hand-written
# caret adds nothing to either and goes stale the moment the lock file
# moves past it. Updating is `./update web`, and reading the diff is how
# a major shows up.
{
  "name": "iggybilly-web",
  "private": true,
  "type": "module",
  "scripts": {
    # Production build: minified, written to ../static/dist.
    "build": "node build.mjs",
    # Same output, unminified — what local/run uses.
    "build:dev": "node build.mjs --dev",
    "dev": "node build.mjs --watch",
    "typecheck": "tsc --noEmit",
    "lint": "eslint .",
    "check": "pnpm run typecheck && pnpm run lint"
  },
  "dependencies": {
    "react": "latest",
    "react-dom": "latest",
    "wavesurfer.js": "latest"
  },
  "devDependencies": {
    # Stands in for eslint-plugin-react, which caps its eslint peer at 9 and
    # has not shipped since April 2025. Rule names and presets differ; the
    # config is written against this one, not ported.
    # https://github.com/jsx-eslint/eslint-plugin-react/issues/3977
    "@eslint-react/eslint-plugin": "latest",
    "@eslint/js": "latest",
    "@types/react": "latest",
    "@types/react-dom": "latest",
    "esbuild": "latest",
    "eslint": "latest",
    "eslint-plugin-react-hooks": "latest",
    "globals": "latest",
    # The one held back. typescript-eslint 8 refuses to load against the
    # TypeScript 7 compiler API and says so on every lint run; 6.0 is
    # still only a beta, so 5 is where this can sit. Drop the range once
    # typescript-eslint ships TS 7 support.
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    "typescript": "^5",
    "typescript-eslint": "latest"
  },
  # The exception: an exact pin, because this one says which pnpm runs
  # rather than what it installs, and corepack verifies it.
  "packageManager": "pnpm@12.5.1"
}
